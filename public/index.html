<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Endless π</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; }

    /* Loading screen shown before Phaser boots */
    #loading-screen {
      position: fixed; inset: 0;
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #FFD700; font-family: 'Arial', sans-serif;
      z-index: 100;
    }
    #loading-screen h1 { font-size: 2.5rem; margin-bottom: 1rem; letter-spacing: 4px; }
    #loading-screen p  { font-size: 1rem; color: #aaa; }
    #loading-screen.hidden { display: none; }

    /* Debug overlay (shown when ?debug is in URL) */
    #pi-debug {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); color: #0f0;
      font-family: monospace; font-size: 11px;
      padding: 6px 8px; z-index: 9999;
      max-height: 45vh; overflow-y: auto;
      border-bottom: 1px solid #0f0;
    }
    #pi-debug.visible { display: block; }
  </style>
</head>
<body>

  <!-- Loading screen (hidden once Phaser starts) -->
  <div id="loading-screen">
    <h1>π RUNNER</h1>
    <p>Loading...</p>
  </div>

  <!-- Game canvas container -->
  <div id="game-container"></div>
  <div id="pi-debug"></div>

  <!-- Runtime config (sandbox flag served from server env var PI_SANDBOX) -->
  <script src="/js/runtime-config.js"></script>

  <!-- Pi Network SDK (required for Pi Browser integration) -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <!-- Initialize SDK using sandbox flag injected by server -->
  <script>
    // Debug helper - visible on screen when ?debug in URL
    (function() {
      var el = document.getElementById('pi-debug');
      var show = location.search.indexOf('debug') !== -1;
      if (show) el.classList.add('visible');
      window.__piLog = function(msg) {
        var t = new Date().toISOString().substr(11,12);
        console.log('[PiDebug] ' + msg);
        if (show) el.innerHTML += t + ' ' + msg + '<br>';
      };
    })();

    window.__piLog('Pi SDK loaded: ' + (typeof Pi !== 'undefined'));
    window.__piLog('sandbox flag: ' + window.__piSandbox);
    window.__piLog('UA: ' + navigator.userAgent.substr(0, 80));

    if (typeof Pi !== 'undefined') {
      try {
        Pi.init({ version: '2.0', sandbox: !!window.__piSandbox });
        window.__piLog('Pi.init() OK, sandbox=' + !!window.__piSandbox);
      } catch(e) {
        window.__piLog('Pi.init() ERROR: ' + e.message);
      }
    } else {
      window.__piLog('Pi is undefined after sdk.js load!');
    }
  </script>

  <!-- Phaser 3 game engine -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- Game entry point (ES module) -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
